<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You</title>

    <style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Playfair Display, serif;

            background:
                radial-gradient(
                    circle at center,
                    #292952 0%,
                    #11112b 48%,
                    #05050f 100%
                );

            color: white;
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            height: 100vh;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           BACKGROUND STARS
        ========================= */

        .stars {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }


        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            opacity: .6;

            animation:
                twinkle 3s ease-in-out infinite;
        }


        .star:nth-child(1) {
            top: 10%;
            left: 12%;
            animation-delay: .2s;
        }

        .star:nth-child(2) {
            top: 17%;
            left: 87%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 35%;
            left: 5%;
            animation-delay: 1.7s;
        }

        .star:nth-child(4) {
            top: 77%;
            left: 8%;
            animation-delay: .5s;
        }

        .star:nth-child(5) {
            top: 88%;
            left: 90%;
            animation-delay: 2s;
        }

        .star:nth-child(6) {
            top: 8%;
            left: 50%;
            animation-delay: 1.2s;
        }

        .star:nth-child(7) {
            top: 82%;
            left: 72%;
            animation-delay: .8s;
        }

        .star:nth-child(8) {
            top: 50%;
            left: 96%;
            animation-delay: 1.5s;
        }

        .star:nth-child(9) {
            top: 92%;
            left: 30%;
            animation-delay: 2.2s;
        }

        .star:nth-child(10) {
            top: 28%;
            left: 93%;
            animation-delay: .4s;
        }

        .star:nth-child(11) {
            top: 7%;
            left: 30%;
            animation-delay: 1.8s;
        }

        .star:nth-child(12) {
            top: 65%;
            left: 3%;
            animation-delay: 1.1s;
        }


        @keyframes twinkle {

            0%, 100% {
                opacity: .2;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }


        /* =========================
           LARGE OVAL
        ========================= */

        .constellation {

            position: absolute;

            width: min(94vw, 1250px);
            height: min(82vh, 780px);

            z-index: 2;
        }


        .constellation svg {

            position: absolute;

            width: 100%;
            height: 100%;

            overflow: visible;
        }


        /* The constellation itself */

        .oval-line {

            fill: none;

            stroke:
                rgba(255, 255, 255, 0.48);

            stroke-width: 1.5;

            stroke-dasharray: 4 7;

            filter:
                drop-shadow(
                    0 0 4px
                    rgba(220,220,255,.4)
                );
        }


        /* Soft glow behind constellation */

        .oval-glow {

            fill: none;

            stroke:
                rgba(210, 210, 255, 0.18);

            stroke-width: 9;

            filter: blur(6px);
        }


        /* =========================
           CONSTELLATION STARS
        ========================= */

        .constellation-dot {

            fill: white;

            filter:
                drop-shadow(
                    0 0 6px
                    rgba(255,255,255,.9)
                );

            animation:
                constellationPulse 3s
                ease-in-out infinite;
        }


        @keyframes constellationPulse {

            0%, 100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================
           PHOTOS
        ========================= */

        .photo {

            position: absolute;

            width: 175px;
            height: 175px;

            object-fit: cover;

            border-radius: 50%;

            border:
                3px solid
                rgba(255,255,255,.92);

            box-shadow:

                0 0 15px
                rgba(255,255,255,.35),

                0 0 38px
                rgba(160,160,255,.3);

            z-index: 6;

            opacity: 0;

            animation:
                photoAppear 1.5s ease forwards,
                gentleFloat 6s ease-in-out infinite;
        }


        @keyframes photoAppear {

            from {

                opacity: 0;

                transform:
                    scale(.65);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes gentleFloat {

            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -6px;
            }
        }


        /* =========================
           SIX PHOTO POSITIONS
        ========================= */


        /* TOP */

        .p1 {

            top: 0%;

            left: 50%;

            transform:
                translateX(-50%);

            animation-delay: .2s;
        }


        /* UPPER LEFT */

        .p2 {

            top: 22%;

            left: 2%;

            animation-delay: .4s;
        }


        /* LOWER LEFT */

        .p3 {

            bottom: 4%;

            left: 13%;

            animation-delay: .6s;
        }


        /* LOWER RIGHT */

        .p4 {

            bottom: 4%;

            right: 13%;

            animation-delay: .8s;
        }


        /* UPPER RIGHT */

        .p5 {

            top: 22%;

            right: 2%;

            animation-delay: 1s;
        }


        /* BOTTOM */

        .p6 {

            bottom: 0%;

            left: 50%;

            transform:
                translateX(-50%);

            animation-delay: 1.2s;
        }


        /* =========================
           CENTRE MESSAGE
        ========================= */

        .message {

            position: absolute;

            z-index: 10;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 430px;

            text-align: center;

            pointer-events: none;
        }


        .message h1 {

            font-size:
                clamp(45px, 5.5vw, 78px);

            line-height: 1.03;

            font-weight: normal;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:

                0 0 10px
                rgba(255,255,255,.9),

                0 0 25px
                rgba(210,210,255,.6),

                0 0 50px
                rgba(160,160,255,.35);

            animation:
                messageGlow 4s
                ease-in-out infinite;
        }


        @keyframes messageGlow {

            0%, 100% {
                opacity: .88;
            }

            50% {
                opacity: 1;
            }
        }


        .heart {

            display: block;

            margin-top: 15px;

            font-size: 30px;

            animation:
                heartbeat 2s
                ease-in-out infinite;
        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        .music-button {

            position: absolute;

            right: 28px;
            bottom: 28px;

            z-index: 20;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.55);

            background:
                rgba(255,255,255,.10);

            backdrop-filter:
                blur(8px);

            color: white;

            font-size: 21px;

            cursor: pointer;

            box-shadow:
                0 0 18px
                rgba(255,255,255,.18);

            transition:
                transform .3s,
                background .3s;
        }


        .music-button:hover {

            transform: scale(1.1);

            background:
                rgba(255,255,255,.2);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .constellation {

                width: 98vw;

                height: 78vh;
            }


            .photo {

                width: 112px;
                height: 112px;
            }


            .p1 {

                top: 1%;
                left: 50%;
            }


            .p2 {

                top: 23%;
                left: 0%;
            }


            .p3 {

                bottom: 5%;
                left: 7%;
            }


            .p4 {

                bottom: 5%;
                right: 7%;
            }


            .p5 {

                top: 23%;
                right: 0%;
            }


            .p6 {

                bottom: 1%;
                left: 50%;
            }


            .message {

                width: 270px;
            }


            .message h1 {

                font-size: 36px;

                letter-spacing: 2px;
            }


            .music-button {

                width: 46px;
                height: 46px;

                right: 18px;
                bottom: 18px;
            }

        }

    </style>

</head>


<body>


<div class="page">

    


    <!-- =========================
         BACKGROUND STARS
    ========================== -->

    <div class="stars">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

    </div>



    <!-- =========================
         OVAL CONSTELLATION
    ========================== -->

    <div class="constellation">

        <svg
            viewBox="0 0 1000 780"
            preserveAspectRatio="none">


            <!-- soft glowing oval -->

            <ellipse
                class="oval-glow"
                cx="500"
                cy="390"
                rx="485"
                ry="360">
            </ellipse>


            <!-- main constellation oval -->

            <ellipse
                class="oval-line"
                cx="500"
                cy="390"
                rx="485"
                ry="360">
            </ellipse>


            <!-- constellation stars -->

            <circle
                class="constellation-dot"
                cx="500"
                cy="30"
                r="3">
            </circle>


            <circle
                class="constellation-dot"
                cx="55"
                cy="210"
                r="3">
            </circle>


            <circle
                class="constellation-dot"
                cx="145"
                cy="690"
                r="3">
            </circle>


            <circle
                class="constellation-dot"
                cx="500"
                cy="750"
                r="3">
            </circle>


            <circle
                class="constellation-dot"
                cx="855"
                cy="690"
                r="3">
            </circle>


            <circle
                class="constellation-dot"
                cx="945"
                cy="210"
                r="3">
            </circle>


        </svg>



        <!-- =========================
             SIX PHOTOS
        ========================== -->

        <img
            src="us1.jpg"
            class="photo p1"
            alt="Memory 1">


        <img
            src="us2.jpg"
            class="photo p2"
            alt="Memory 2">


        <img
            src="us3.jpg"
            class="photo p3"
            alt="Memory 3">


        <img
            src="us4.jpg"
            class="photo p4"
            alt="Memory 4">


        <img
            src="us5.jpg"
            class="photo p5"
            alt="Memory 5">


        <img
            src="us6.jpg"
            class="photo p6"
            alt="Memory 6">


    </div>



    <!-- =========================
         CENTRE MESSAGE
    ========================== -->

    <div class="message">

        <h1>
            I Love You
        </h1>

        <span class="heart">✨</span>

    </div>



    <!-- =========================
         MUSIC
    ========================== -->

    <audio
        id="music"
        loop
        autoplay>

        <source
            src="music.mp3"
            type="audio/mpeg">

    </audio>


    <button
        class="music-button"
        id="musicButton">

        ♫

    </button>


</div>



<script>


    /* =========================
       MUSIC CONTROL
    ========================== */

    const music =
        document.getElementById("music");

    const musicButton =
        document.getElementById("musicButton");


    let playing = false;


    /*
       Try to start music automatically.
       Some browsers allow this;
       others block autoplay with sound.
    */

    window.addEventListener(
        "load",
        function () {

            music.volume = 0.65;

            music.play()
                .then(() => {

                    playing = true;

                    musicButton.innerHTML = "♫";

                })
                .catch(() => {

                    /*
                       Browser blocked autoplay.
                       Music will start after
                       the first interaction.
                    */

                    playing = false;

                    musicButton.innerHTML = "♪";

                });

        }
    );


    /*
       Music button:
       PLAY / STOP
    */

    musicButton.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();


            if (!playing) {

                music.play()
                    .then(() => {

                        playing = true;

                        musicButton.innerHTML = "♫";

                    });

            }

            else {

                music.pause();

                playing = false;

                musicButton.innerHTML = "♪";

            }

        }
    );


    /*
       If autoplay was blocked,
       first interaction starts music.
    */

    document.addEventListener(
        "click",
        function startAfterInteraction() {

            if (!playing) {

                music.play()
                    .then(() => {

                        playing = true;

                        musicButton.innerHTML = "♫";

                    })
                    .catch(() => {});

            }

        },
        { once: true }
    );


</script>


</body>
</html>
